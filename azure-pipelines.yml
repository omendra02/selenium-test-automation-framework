# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
  branches:
    include:
      - master
      - main
  paths:
    exclude:
      - 'README.md'
      - '.gitignore'

variables:
  - group: test-automation-vars  # Store sensitive variables in Azure DevOps variable groups
  - name: MAVEN_CACHE_FOLDER
    value: $(Pipeline.Workspace)/.m2/repository
  - name: CHROME_DRIVER_VERSION
    value: '114.0.5735.90'  # Specify ChromeDriver version

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: Build
        displayName: 'Build and Run Tests'
        steps:
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)
            displayName: 'Cache Maven local repository'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.8'
              jdkArchitectureOption: 'x64'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              goals: 'clean package'
            displayName: 'Build and Run Tests'

          - task: DownloadChromeDriver@1
            inputs:
              chromeDriverVersion: $(CHROME_DRIVER_VERSION)
            displayName: 'Download ChromeDriver'

          - script: |
              export TEST_BASE_URL=$(TEST_BASE_URL)
              export TEST_VALID_EMAIL=$(TEST_VALID_EMAIL)
              export TEST_VALID_PASSWORD=$(TEST_VALID_PASSWORD)
              export TEST_INVALID_EMAIL=$(TEST_INVALID_EMAIL)
              export TEST_INVALID_PASSWORD=$(TEST_INVALID_PASSWORD)
              export TEST_RESULTS_PATH=$(System.DefaultWorkingDirectory)/TestResults
              
              # Create TestResults directory if it doesn't exist
              mkdir -p $(TEST_RESULTS_PATH)
              
              # Run Selenium tests
              java -cp "target/javaselenium-0.0.1-SNAPSHOT.jar:src/test/java" Test.TestLogin
            displayName: 'Run Selenium Tests'
            env:
              TEST_BASE_URL: $(TEST_BASE_URL)
              TEST_VALID_EMAIL: $(TEST_VALID_EMAIL)
              TEST_VALID_PASSWORD: $(TEST_VALID_PASSWORD)
              TEST_INVALID_EMAIL: $(TEST_INVALID_EMAIL)
              TEST_INVALID_PASSWORD: $(TEST_INVALID_PASSWORD)

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/TEST-*.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)'
              mergeTestResults: true
              failTaskOnFailedTests: true
            displayName: 'Publish Test Results'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/TestResults'
              ArtifactName: 'TestResults'
              publishLocation: 'Container'
            displayName: 'Publish Test Results as Artifact'

  - stage: Deploy
    displayName: 'Deploy Test Results'
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: 'Deploy Results'
        steps:
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/TestResults'
              artifactName: 'TestResults'
              publishLocation: 'pipeline'
            displayName: 'Publish Pipeline Artifact'

